# Privacy-minimized, sampled stream diagnostics.
# The route label is static; no client IP, request URI, query, Referer, or UA is logged.
map $uri $nova_stream_route {
    default "";
    ~^/api/anime/hls-proxy(/|$) hls_manifest;
    ~^/api/anime/seg-proxy(/|$) hls_segment;
    ~^/api/anime/video-proxy(/|$) video_proxy;
    ~^/api/anime/download-mp4$ mp4_download;
    ~^/api/(anime|animation)/sources-stream(/|$) source_discovery;
    ~^/api/anime/fetch-source(/|$) source_discovery;
    ~^/api/dubbed/stream(/|$) dubbed_stream;
    ~^/cdn-proxy(/|$) cdn_proxy;
}

split_clients "$request_id" $nova_stream_sample {
    5%      1;
    *       0;
}

map "$nova_stream_route:$nova_stream_sample" $nova_stream_loggable {
    default 0;
    ~^.+:1$ 1;
}

log_format nova_stream_metrics escape=json
    '{"time":"$time_iso8601","route":"$nova_stream_route","status":$status,"bytes":$body_bytes_sent,"request_s":$request_time,"upstream_s":"$upstream_response_time","upstream_status":"$upstream_status","cache":"$upstream_cache_status"}';

# /run is tmpfs on this VPS; this avoids introducing another unrotated disk log.
access_log /run/nova-stream-metrics.log nova_stream_metrics buffer=16k flush=5s if=$nova_stream_loggable;