openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: source-catalog
    description: Read-only provider catalog browsing and filtering
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /anime/skip-times:
    get:
      operationId: getAnimeSkipTimes
      tags: [anime]
      summary: Resolve opening and ending skip times for an episode
      parameters:
        - name: anilistId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: ep
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
        - name: intro
          in: query
          required: false
          description: Whether to resolve the opening timing; defaults to true.
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
        - name: outro
          in: query
          required: false
          description: Whether to resolve the ending timing; defaults to true.
          schema:
            type: string
            enum: ["0", "1"]
            default: "1"
      responses:
        "200":
          description: Available skip timings, with missing timings represented as null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimeSkipTimes"
        "400":
          description: Invalid episode identity or no timing type requested
        "503":
          description: A timing provider could not complete the requested lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnimeSkipTimes"
  /source-catalog/categories:
    get:
      operationId: getSourceCatalogCategories
      tags: [source-catalog]
      summary: List categories and coverage for a provider catalog
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CatalogProvider"
      responses:
        "200":
          description: Category labels and title counts; categories may overlap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalogCategoriesResponse"
        "400":
          description: Missing or unsupported provider
  /source-catalog/titles:
    get:
      operationId: getSourceCatalogTitles
      tags: [source-catalog]
      summary: Search and filter source catalog titles
      parameters:
        - name: provider
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CatalogProvider"
        - name: mediaType
          in: query
          required: false
          schema:
            type: string
            enum: [series, movie]
        - name: category
          in: query
          required: false
          description: Exact provider category; titles can belong to multiple categories
          schema:
            type: string
            maxLength: 120
        - name: tag
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: catalogStatus
          in: query
          required: false
          schema:
            type: string
            enum: [catalogued, details_checked, partial, failed]
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Filtered source catalog titles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalogTitlesResponse"
        "400":
          description: Invalid filter
  /source-catalog/episodes/{episodeId}/servers:
    get:
      operationId: getSourceCatalogEpisodeServers
      tags: [source-catalog]
      summary: List server references for one episode without resolving media
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
        - name: quality
          in: query
          required: false
          schema:
            type: string
            maxLength: 30
      responses:
        "200":
          description: Server page references for this episode only; media is resolved after selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceCatalogEpisodeServersResponse"
        "400":
          description: Invalid episode identifier
        "404":
          description: Episode not found
  /anime/stardima/resolve:
    post:
      operationId: resolveSelectedStardimaServer
      tags: [source-catalog]
      summary: Resolve and verify only the StarDima server selected by the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StardimaResolveRequest"
      responses:
        "200":
          description: A verified internal-player media URL for the selected server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StardimaResolveResponse"
        "400":
          description: Invalid server ID
        "404":
          description: Selected server is not in the StarDima catalog
        "422":
          description: Selected link is dead, unsupported, expired, or cannot be extracted
        "429":
          description: Resolution rate limit exceeded
        "502":
          description: Upstream blocked or unreachable
        "503":
          description: Health result could not be persisted
  /device-link/request:
    post:
      operationId: createDeviceLinkCode
      tags: [device-link]
      summary: Create a short-lived device linking code
      responses:
        "200":
          description: Six-digit linking code created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLinkCode"
        "401":
          description: Source phone user is not signed in
        "429":
          description: Rate limit exceeded
  /device-link/claim:
    post:
      operationId: claimDeviceLinkCode
      tags: [device-link]
      summary: Exchange a phone code for a linked-device session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceLinkClaimRequest"
      responses:
        "200":
          description: Device linked and user session returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLinkUserSession"
        "400":
          description: Invalid or already-used code
        "410":
          description: Code expired
        "429":
          description: Rate limit exceeded
  /device-link/devices:
    get:
      operationId: listLinkedDevices
      tags: [device-link]
      summary: List active linked devices for the signed-in phone
      responses:
        "200":
          description: Active linked devices
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkedDevice"
        "401":
          description: User is not signed in
  /device-link/devices/{id}:
    delete:
      operationId: revokeLinkedDevice
      tags: [device-link]
      summary: Revoke a linked device
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device revoked
        "401":
          description: User is not signed in
        "404":
          description: Device not found
  /device-link/heartbeat:
    post:
      operationId: linkedDeviceHeartbeat
      tags: [device-link]
      summary: Mark a linked device as recently active
      responses:
        "200":
          description: Heartbeat accepted
        "401":
          description: Invalid linked-device token
        "403":
          description: Device link was revoked
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SkipInterval:
      type: object
      required: [start, end]
      properties:
        start:
          type: number
          minimum: 0
        end:
          type: number
          exclusiveMinimum: 0
    AnimeSkipTimes:
      type: object
      required: [intro, outro, checkedIntro, checkedOutro, retryAfterMs]
      properties:
        intro:
          oneOf:
            - $ref: "#/components/schemas/SkipInterval"
            - type: "null"
        outro:
          oneOf:
            - $ref: "#/components/schemas/SkipInterval"
            - type: "null"
        checkedIntro:
          type: boolean
          description: Whether all available providers were checked for an opening time.
        checkedOutro:
          type: boolean
          description: Whether all available providers were checked for an ending time.
        retryAfterMs:
          type: integer
          minimum: 0
    DeviceLinkCode:
      type: object
      required: [ok, requestId, code, expiresAt, ttlSeconds]
      properties:
        ok:
          type: boolean
        requestId:
          type: string
          format: uuid
        code:
          type: string
          pattern: "^[0-9]{6}$"
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
    DeviceLinkClaimRequest:
      type: object
      required: [code, deviceId]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
        deviceId:
          type: string
          minLength: 6
          maxLength: 160
        deviceName:
          type: string
          maxLength: 80
        platform:
          type: string
          maxLength: 30
    LinkedDevice:
      type: object
      required: [id, deviceId, name, platform, linkedAt, lastSeenAt]
      properties:
        id:
          type: string
          format: uuid
        deviceId:
          type: string
        name:
          type: string
        platform:
          type: string
        linkedAt:
          type: string
          format: date-time
        lastSeenAt:
          type: string
          format: date-time
    DeviceLinkUserSession:
      type: object
      required: [ok, id, email, displayName, authType, authToken, deviceId]
      properties:
        ok:
          type: boolean
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        username:
          type: string
          nullable: true
        avatarColor:
          type: integer
        profileImageUrl:
          type: string
          nullable: true
        authType:
          type: string
          enum: [device-link]
        authToken:
          type: string
        authTokenExp:
          type: integer
        deviceId:
          type: string
        device:
          $ref: "#/components/schemas/LinkedDevice"
    CatalogProvider:
      type: string
      enum: [animeify, anslayer, sanime, anifox, stardima_catalog]
    SourceCatalogCategoriesResponse:
      type: object
      required: [provider, totalTitles, classifiedTitles, unclassifiedTitles, categories, localizationLabels]
      properties:
        provider:
          $ref: "#/components/schemas/CatalogProvider"
        totalTitles:
          type: integer
          minimum: 0
        classifiedTitles:
          type: integer
          minimum: 0
        unclassifiedTitles:
          type: integer
          minimum: 0
        categories:
          type: array
          items:
            type: object
            required: [name, titleCount]
            properties:
              name:
                type: string
              titleCount:
                type: integer
                minimum: 1
        localizationLabels:
          type: array
          items:
            type: object
            required: [name, titleCount]
            properties:
              name:
                type: string
              titleCount:
                type: integer
                minimum: 1
    SourceCatalogClassification:
      type: object
      required: [version, status, contentFamilies, familyEvidence, sourceCategories, sourceTags, localizationLabels, source, detailCheckedAt]
      properties:
        version:
          type: integer
        status:
          type: string
          enum: [classified, source_labeled, needs_review, manually_reviewed]
        contentFamilies:
          type: array
          items:
            type: string
        familyEvidence:
          type: string
          enum: [title_detail, catalog_list, ""]
        sourceCategories:
          type: array
          items:
            type: string
        sourceTags:
          type: array
          items:
            type: string
        localizationLabels:
          type: array
          items:
            type: string
        source:
          type: string
        detailCheckedAt:
          type: [string, "null"]
          format: date-time
    SourceCatalogTitlesResponse:
      type: object
      required: [results, page, limit, provider, query, mediaType, category, tag, catalogStatus]
      properties:
        results:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              classification:
                oneOf:
                  - $ref: "#/components/schemas/SourceCatalogClassification"
                  - type: "null"
        page:
          type: integer
        limit:
          type: integer
        provider:
          oneOf:
            - $ref: "#/components/schemas/CatalogProvider"
            - type: "null"
        query:
          type: string
        mediaType:
          type: [string, "null"]
        category:
          type: [string, "null"]
        tag:
          type: [string, "null"]
        catalogStatus:
          type: [string, "null"]
    SourceCatalogEpisodeServersResponse:
      type: object
      required: [servers, omittedServerCount, pagesOnly, playback]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/SourceCatalogServer"
        omittedServerCount:
          type: integer
          minimum: 0
        pagesOnly:
          type: boolean
          const: true
        playback:
          type: string
          enum: [internal-resolve-and-verify, resolve-on-demand]
    SourceCatalogServer:
      type: object
      required: [id, provider, page_url, availability_status]
      properties:
        id:
          type: integer
        provider:
          $ref: "#/components/schemas/CatalogProvider"
        page_url:
          type: [string, "null"]
          format: uri
        server_key:
          type: [string, "null"]
        server_name:
          type: [string, "null"]
        source_host:
          type: [string, "null"]
        quality:
          type: [string, "null"]
        language:
          type: [string, "null"]
        availability_status:
          type: string
          enum: [link_found, media_verified, dead, unsupported]
        health_state:
          type: [string, "null"]
        health_reason:
          type: [string, "null"]
        health_checked_at:
          type: [string, "null"]
          format: date-time
        last_checked_at:
          type: [string, "null"]
          format: date-time
        needs_recheck:
          type: boolean
    StardimaResolveRequest:
      type: object
      required: [serverId]
      properties:
        serverId:
          type: integer
          minimum: 1
    StardimaResolveResponse:
      type: object
      required: [directUrl, type, serverName, sourceHost, headers, health]
      properties:
        directUrl:
          type: string
          format: uri
        type:
          type: string
          enum: [hls, mp4]
        quality:
          type: [string, "null"]
        serverName:
          type: string
        sourceHost:
          type: string
        headers:
          type: object
          properties:
            Referer:
              type: string
              format: uri
            Origin:
              type: string
              format: uri
        health:
          type: object
          required: [state, checkedAt]
          properties:
            state:
              type: string
              const: verified
            checkedAt:
              type: string
              format: date-time

