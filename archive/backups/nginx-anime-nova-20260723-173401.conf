# ══════════════════════════════════════════════════════════════════
#  Anime NOVA — Nginx config مُحسَّن للـ HLS streaming
# ══════════════════════════════════════════════════════════════════

upstream nova_backend {
    server 127.0.0.1:5000;
    keepalive 64;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

proxy_cache_path /var/cache/nginx/hls
    levels=1:2
    keys_zone=hls_cache:10m
    max_size=1g
    inactive=1h
    use_temp_path=off;

# HTTP → HTTPS
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name animenovaa.duckdns.org;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name animenovaa.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/animenovaa.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animenovaa.duckdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 50M;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json application/vnd.apple.mpegurl text/vtt text/xml image/svg+xml;

    # ── HLS manifests (.m3u8) — cache 30s ───────────────────────
    # NOVA_MOBILE_DOWNLOAD
    location /nova-mobile/ {
        proxy_pass http://127.0.0.1:5100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /api/anime/hls-proxy {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_cache hls_cache;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── HLS segments (.ts/.m4s) — cache 1h ──────────────────────
    location /api/anime/seg-proxy {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering on;
        proxy_buffers 32 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 2048m;
        proxy_cache hls_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 3s;
        add_header X-Cache-Status $upstream_cache_status;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── MP4 video streaming — no cache ──────────────────────────
    location /api/anime/video-proxy {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }


    # ── SSE: sources-stream + animation sources-stream — no buffer ────────
    location ~ ^/api/(anime|animation)/sources-stream {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 15s;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
        add_header Access-Control-Allow-Origin "*";
    }

    # ── SSE (translate-vtt-stream) — no buffer ──────────────────
    location ~ ^/api/anime/translate-vtt-stream {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
        add_header Cache-Control "no-cache";
        add_header X-Accel-Buffering "no";
    }

    # ── Static assets — cache 7d ─────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|eot|ico|svg|png|jpg|jpeg|webp|gif)$ {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache hls_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_use_stale error timeout;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800, immutable";
        proxy_read_timeout 30s;
    }

    # ── CDN proxy (Referer injection للمتصفح) ──────────────────────
    location /cdn-proxy {
        proxy_pass http://127.0.0.1:8000/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Range $http_range;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Content-Type";
    }

    # ── Everything else ──────────────────────────────────────────
    location / {
        proxy_pass http://nova_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering on;
        proxy_buffers 16 32k;
        proxy_buffer_size 64k;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
