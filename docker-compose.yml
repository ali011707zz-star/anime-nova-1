services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nova_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      NODE_ENV: "production"
      CF_PROXY_PORT: "8082"
    env_file:
      - .env.production
    networks:
      - nova_net

  nginx:
    image: nginx:alpine
    container_name: nova_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - nova_net

networks:
  nova_net:
    driver: bridge
