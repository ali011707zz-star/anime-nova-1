name: 🤖 بناء APK أندرويد

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_domain:
        description: 'Backend API URL'
        required: false
        default: 'https://animenovaa.duckdns.org'

env:
  EXPO_PUBLIC_DOMAIN: ${{ github.event.inputs.backend_domain || 'https://animenovaa.duckdns.org' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 💾 pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 💾 Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: 🏗️ Expo Prebuild
        working-directory: artifacts/nova-mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('artifacts/nova-mobile/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🔨 Build APK
        working-directory: artifacts/nova-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 📱 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeNova-v${{ github.run_number }}
          path: artifacts/nova-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: ✅ APK Info
        run: |
          APK=$(find artifacts/nova-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK" ]; then
            echo "✅ تم البناء بنجاح — الحجم: $(du -h "$APK" | cut -f1)"
          else
            echo "❌ فشل البناء"
            exit 1
          fi
