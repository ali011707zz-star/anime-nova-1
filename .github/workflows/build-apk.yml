name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/nova-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (EAS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install monorepo dependencies
        run: pnpm install --filter @workspace/nova-mobile...

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK
        working-directory: artifacts/nova-mobile
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Print build URL
        run: |
          echo "✅ Build submitted!"
          echo "https://expo.dev/accounts/ali011707s-team/projects/anime-nova-/builds"
