name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/nova-mobile/**'
  workflow_dispatch:
    inputs:
      backend_domain:
        description: 'Backend API domain (e.g. https://yourapp.replit.app)'
        required: false
        default: 'https://anime-nova.orkestr.run'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install all workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android native project (expo prebuild)
        working-directory: artifacts/nova-mobile
        run: npx expo prebuild --platform android --clean
        env:
          EXPO_PUBLIC_DOMAIN: ${{ github.event.inputs.backend_domain || 'https://anime-nova.orkestr.run' }}

      - name: Make Gradlew executable
        working-directory: artifacts/nova-mobile/android
        run: chmod +x gradlew

      - name: Build debug APK (signed with debug key — installable)
        working-directory: artifacts/nova-mobile/android
        run: ./gradlew assembleDebug --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-nova-debug-apk
          path: artifacts/nova-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Print APK info
        run: |
          APK="artifacts/nova-mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK" ]; then
            echo "✅ APK built successfully: $(du -sh $APK | cut -f1)"
          else
            echo "❌ APK not found"
          fi
