name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/nova-mobile/**'
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Local Gradle)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install monorepo dependencies
        run: pnpm install --filter @workspace/nova-mobile... --no-frozen-lockfile

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Expo CLI
        run: npm install -g expo-cli @expo/cli

      - name: Generate Android native project (prebuild)
        working-directory: artifacts/nova-mobile
        run: npx expo prebuild --platform android --clean --no-install
        env:
          EXPO_PUBLIC_DOMAIN: https://anime-nova.orkestr.run

      - name: Make Gradlew executable
        working-directory: artifacts/nova-mobile/android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: artifacts/nova-mobile/android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.parallel=true"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anime-nova-release-apk
          path: artifacts/nova-mobile/android/app/build/outputs/apk/release/app-release*.apk
          retention-days: 14
