name: 🤖 بناء APK أندرويد

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_domain:
        description: 'Backend API URL'
        required: false
        default: 'https://animenovaa.duckdns.org'

env:
  EXPO_PUBLIC_DOMAIN: ${{ github.event.inputs.backend_domain || 'https://animenovaa.duckdns.org' }}

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 💾 pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 💾 Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: 📥 Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: ✅ Verify native video player
        run: |
          set -eu
          if grep -q '"expo-video"' artifacts/nova-mobile/package.json; then
            echo "❌ expo-video must not be used by the native APK player"
            exit 1
          fi
          grep -q '"react-native-video"' artifacts/nova-mobile/package.json
          test -e artifacts/nova-mobile/node_modules/react-native-video
          grep -q 'from "react-native-video"' artifacts/nova-mobile/components/RiftPlayer.tsx
          echo "✅ react-native-video is installed and RiftPlayer uses it"

      - name: 🏗️ Expo Prebuild
        working-directory: artifacts/nova-mobile
        # استخدام نسخة expo المثبّتة محلياً (لا npx الذي قد يحمّل نسخة أخرى)
        run: ./node_modules/.bin/expo prebuild --platform android --clean --no-install

      # ── إصلاح Gradle: تثبيت 8.13 + إصلاح توافق react-native-video ──────────
      # RN 0.81.5 يستخدم deprecated Gradle APIs تُعتبر أخطاءً في 8.8+.
      # 2026-07-10: AGP الحالي يتطلب Gradle 8.13 كحد أدنى.
      # 2026-07-23: react-native-video يقرأ rootProject.ext.kotlinVersion، لكن
      #   RN 0.74+ يضعه في buildscript.ext (كائن منفصل) فيجد rnv أن rootProject.ext
      #   فارغ ويستخدم نسخة "1.8.0" القديمة من project.properties مما يسبب تعارضاً.
      #   الحل: إضافة ext.kotlinVersion في build.gradle على مستوى المشروع.
      - name: 🔧 Fix Gradle compatibility
        working-directory: artifacts/nova-mobile/android
        run: |
          # ── 1. تثبيت Gradle wrapper على 8.13 ──
          sed -i \
            's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' \
            gradle/wrapper/gradle-wrapper.properties

          # ── 2. تعطيل أخطاء الإهمال وإعدادات BuildConfig ──
                    echo "org.gradle.warning.mode=none" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties
          echo "android.defaults.buildfeatures.buildconfig=true" >> gradle.properties

          # ── 3. إضافة kotlinVersion لـ rootProject.ext لتوافق react-native-video ──
          # RN 0.74+ يضع kotlinVersion في buildscript.ext فقط؛ rnv يتحقق من rootProject.ext
          # فيجد null ويرجع لقيمة "1.8.0" الافتراضية مما يسبب تعارض classpath.
          # نستخرج النسخة الفعلية من build.gradle ونضيفها للـ project-level ext.
          KOTLIN_VER=$(grep -m1 'kotlinVersion\s*=\s*"' build.gradle | grep -oP '"\K[^"]+' || true)
          if [ -z "$KOTLIN_VER" ]; then KOTLIN_VER="2.0.21"; fi
          echo "ℹ️  kotlinVersion = ${KOTLIN_VER}"
          echo "" >> build.gradle
          echo "// react-native-video: kotlinVersion must be in project ext (not buildscript.ext)" >> build.gradle
          echo "ext.kotlinVersion = \"${KOTLIN_VER}\"" >> build.gradle
          echo "✅ Added ext.kotlinVersion = ${KOTLIN_VER} to build.gradle"

          # ── 4. إضافة jvmTarget صريح لـ react-native-video مع AGP 8.x ──
          # rnv build.gradle يتخطى compileOptions/kotlinOptions عند AGP >= 8
          # مما يتسبب في عدم تطابق jvmTarget بين الـ modules.
          RNV_BUILD=$(find ../node_modules/react-native-video/android -maxdepth 1 -name "build.gradle" 2>/dev/null | head -1)
          if [ -n "$RNV_BUILD" ]; then
            # أضف compileOptions + kotlinOptions للـ android{} block إذا AGP >= 8
            # كتابة سكريبت Python مؤقت لتجنب مشكلة YAML مع heredoc
            PYSCRIPT=$(mktemp /tmp/patch_rnv_XXXXXX.py)
            echo 'import sys' >> "$PYSCRIPT"
            echo 'path = sys.argv[1]' >> "$PYSCRIPT"
            echo 'content = open(path).read()' >> "$PYSCRIPT"
            echo 'patch = "\n    // AGP 8.x fix: add explicit Java/Kotlin compatibility\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    kotlinOptions {\n        jvmTarget = JavaVersion.VERSION_17.majorVersion\n    }\n"' >> "$PYSCRIPT"
            echo 'old = "    buildFeatures {\n        buildConfig true\n    }"' >> "$PYSCRIPT"
            echo 'new = patch + "\n    buildFeatures {\n        buildConfig true\n    }"' >> "$PYSCRIPT"
            echo 'if patch.strip() not in content:' >> "$PYSCRIPT"
            echo '    content = content.replace(old, new, 1)' >> "$PYSCRIPT"
            echo '    open(path, "w").write(content)' >> "$PYSCRIPT"
            echo '    print("Patched " + path + " -- added jvmTarget=17")' >> "$PYSCRIPT"
            echo 'else:' >> "$PYSCRIPT"
            echo '    print(path + " already patched")' >> "$PYSCRIPT"
            python3 "$PYSCRIPT" "$RNV_BUILD"
            rm -f "$PYSCRIPT"
          fi

          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== build.gradle (last 5 lines) ==="
          tail -5 build.gradle
          echo "=== gradle.properties (last 10 lines) ==="
          tail -10 gradle.properties

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-8.13-${{ hashFiles('artifacts/nova-mobile/android/app/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-8.13-

      - name: 🔨 Build APK
        working-directory: artifacts/nova-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.warning.mode=none"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --warning-mode=none \
            --stacktrace \
            2>&1 | tee build.log || {
              echo ""
              echo "══════ آخر 200 سطر من سجل البناء ══════"
              tail -200 build.log
              exit 1
            }

      - name: 📱 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeNova-v${{ github.run_number }}
          path: artifacts/nova-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: artifacts/nova-mobile/android/build.log
          retention-days: 7

      - name: ✅ APK Info
        run: |
          APK=$(find artifacts/nova-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK" ]; then
            echo "✅ تم البناء بنجاح — الحجم: $(du -h "$APK" | cut -f1)"
          else
            echo "❌ فشل البناء"
            exit 1
          fi
