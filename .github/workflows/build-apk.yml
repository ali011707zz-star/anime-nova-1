name: 🤖 بناء APK أندرويد

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_domain:
        description: 'Backend API URL'
        required: false
        default: 'https://animenovaa.duckdns.org'

env:
  EXPO_PUBLIC_DOMAIN: ${{ github.event.inputs.backend_domain || 'https://animenovaa.duckdns.org' }}
  NODE_ENV: production

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 📦 Checkout
        uses: actions/checkout@v4

      - name: ☕ Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔧 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: 💾 pnpm store path
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: 💾 Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          # v2: bumped to invalidate a corrupted pnpm store cache that was
          # silently dropping extracted package files ("Failed to create bin"
          # for tsx/jiti/prettier/etc.), which broke workspace bin symlinks
          # like artifacts/nova-mobile/node_modules/.bin/expo.
          key: pnpm-v2-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: pnpm-v2-${{ runner.os }}-

      - name: 📥 Install dependencies
        run: |
          pnpm install --no-frozen-lockfile
          # pnpm's content-addressable store extraction occasionally races
          # on a cold, many-workspace-package install and leaves some bin
          # symlinks missing (ENOENT) even though the package was "added"
          # (seen with tsx/jiti/prettier/expo). A second pass repairs any
          # missing links without re-downloading anything already extracted.
          if [ ! -e artifacts/nova-mobile/node_modules/.bin/expo ]; then
            echo "⚠️ expo bin missing after install — repairing (pnpm store extraction race)"
            pnpm install --no-frozen-lockfile
          fi
          if [ ! -e artifacts/nova-mobile/node_modules/.bin/expo ]; then
            echo "❌ expo bin still missing after repair attempt"
            exit 1
          fi

      - name: 🩹 Fix react-native-video Android compatibility
        working-directory: artifacts/nova-mobile
        run: |
          set -eu

          # react-native-video is still part of the Android dependency graph
          # even though the app's primary native player is NovaMedia3. Its
          # Gradle/Kotlin sources need these small compatibility fixes with
          # RN 0.81 + AGP 8.
          RNV="node_modules/react-native-video"
          RNV_SRC="$RNV/android/src/main/java/com/brentvatne"
          if [ ! -d "$RNV_SRC" ]; then
            echo "❌ react-native-video Android sources were not found: $RNV_SRC"
            find node_modules -path "*/react-native-video/android/src/main/java/com/brentvatne" -type d -print
            exit 1
          fi

          chmod -R u+w "$RNV/android" 2>/dev/null || true

          # Kotlin's newer React Native types make getMap(i) nullable.
          # Apply the guard only when the older expression is present so this
          # remains safe if a future react-native-video release already fixes it.
          python3 - "$RNV_SRC" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          replacements = {
              "common/api/CMCDProps.kt": (
                  "val item = array.getMap(i)",
                  "val item = array.getMap(i) ?: return@mapNotNull null",
              ),
              "common/api/SideLoadedTextTrackList.kt": (
                  "val textTrack: ReadableMap = src.getMap(i)",
                  "val textTrack: ReadableMap? = src.getMap(i)",
              ),
              "common/api/Source.kt": (
                  "val current = propSrcHeadersArray.getMap(i)",
                  "val current = propSrcHeadersArray.getMap(i) ?: continue",
              ),
          }

          for relative, (old, new) in replacements.items():
              path = root / relative
              if not path.exists():
                  print(f"SKIP {relative}: file not found")
                  continue
              content = path.read_text()
              if old in content:
                  path.write_text(content.replace(old, new, 1))
                  print(f"OK {relative}")
              else:
                  print(f"SKIP {relative}: already compatible")
          PY

      - name: 🏗️ Expo Prebuild
        working-directory: artifacts/nova-mobile
        # Never let npx download a different Expo CLI during the build.
        run: ./node_modules/.bin/expo prebuild --platform android --clean --no-install

      # ── إصلاح Gradle/Kotlin: تثبيت 8.13 + توافق react-native-video ────────
      # RN 0.81.5 يستخدم deprecated Gradle APIs تُعتبر أخطاءً في 8.8+.
      # 2026-07-10: AGP الحالي يتطلب Gradle 8.13 كحد أدنى (8.10.2 صار يفشل البناء بـ
      # "Minimum supported Gradle version is 8.13. Current version is 8.10.2.")
      # react-native-video يقرأ rootProject.ext.kotlinVersion ويحتاج أيضاً
      # target JVM صريحاً مع AGP 8.
      - name: 🔧 Fix Gradle compatibility
        working-directory: artifacts/nova-mobile/android
        run: |
          sed -i \
            's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-all.zip|' \
            gradle/wrapper/gradle-wrapper.properties

          grep -q '^ext.kotlinVersion' build.gradle || {
            printf '\n// react-native-video compatibility with RN 0.81 / AGP 8\next.kotlinVersion = "1.9.25"\n' >> build.gradle
          }

          RNV_BUILD="../node_modules/react-native-video/android/build.gradle"
          if [ ! -f "$RNV_BUILD" ]; then
            echo "❌ react-native-video build.gradle was not found: $RNV_BUILD"
            exit 1
          fi

          python3 - "$RNV_BUILD" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          content = path.read_text()
          marker = "// NOVA AGP 8 JVM compatibility"
          if marker not in content:
              needle = "android {\n"
              patch = """android {
              // NOVA AGP 8 JVM compatibility
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = JavaVersion.VERSION_17.majorVersion
              }
          """
              if needle not in content:
                  raise SystemExit(f"Could not find android block in {path}")
              path.write_text(content.replace(needle, patch, 1))
              print(f"OK patched {path}")
          else:
              print(f"SKIP {path}: already patched")
          PY

          printf '%s\n' \
            'org.gradle.warning.mode=none' \
            'android.suppressUnsupportedCompileSdk=35' \
            'android.defaults.buildfeatures.buildconfig=true' >> gradle.properties

          echo "=== gradle-wrapper.properties ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== root build.gradle (last 5 lines) ==="
          tail -5 build.gradle
          echo "=== react-native-video build.gradle (first 35 lines) ==="
          sed -n '1,35p' "$RNV_BUILD"
          echo "=== gradle.properties (last 10 lines) ==="
          tail -10 gradle.properties

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-8.13-${{ hashFiles('artifacts/nova-mobile/android/app/build.gradle') }}
          restore-keys: gradle-${{ runner.os }}-8.13-

      - name: 🔨 Build APK
        working-directory: artifacts/nova-mobile/android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4096m -Dorg.gradle.warning.mode=none"
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon \
            --warning-mode=none \
            --stacktrace \
            2>&1 | tee build.log || {
              echo ""
              echo "══════ Gradle failure summary ══════"
              grep -nE -C 4 'What went wrong|Execution failed|Could not|error:|e: |FAILED|Caused by:' build.log | tail -240 || true
              echo "══════ آخر 200 سطر من سجل البناء ══════"
              tail -200 build.log
              exit 1
            }

      - name: 📱 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeNova-v${{ github.run_number }}
          path: artifacts/nova-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: 📤 Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-v${{ github.run_number }}
          path: artifacts/nova-mobile/android/build.log
          retention-days: 7

      - name: ✅ APK Info
        run: |
          APK=$(find artifacts/nova-mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -f "$APK" ]; then
            echo "✅ تم البناء بنجاح — الحجم: $(du -h "$APK" | cut -f1)"
          else
            echo "❌ فشل البناء"
            exit 1
          fi
