name: Build Nova TV v2

on:
  workflow_dispatch:
  push:
    paths:
      - "nova-tv-v2/**"
      - ".github/workflows/build-nova-tv-v2.yml"

permissions:
  contents: read

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        working-directory: nova-tv-v2
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Nova TV v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: Nova-TV-v2-debug
          path: nova-tv-v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error