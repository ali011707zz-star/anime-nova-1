name: 🍪 تجديد كوكيز Cloudflare

on:
  schedule:
    # كل 18 ساعة (cf_clearance يدوم 24h → هامش أمان 6h)
    - cron: "0 */18 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: 'الموقع المراد تجديد كوكيزه'
        required: false
        default: 'anime3rb'

jobs:
  refresh:
    name: تجديد cf_clearance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 🐍 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 تثبيت curl_cffi
        run: pip install curl_cffi

      - name: 🌐 جلب cf_clearance من anime3rb
        env:
          SITE: ${{ github.event.inputs.site || 'anime3rb' }}
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          python3 << 'PYEOF'
          import os, sys, time, json
          from curl_cffi import requests as cf_requests

          SITE = os.environ.get("SITE", "anime3rb")
          URLS = {"anime3rb": "https://anime3rb.com"}
          TARGET = URLS.get(SITE)

          if not TARGET:
              print(f"[!] موقع غير معروف: {SITE}")
              sys.exit(1)

          print(f"[*] طلب {TARGET} عبر curl_cffi (Chrome TLS fingerprint) ...")

          # curl_cffi يُزوّر TLS fingerprint لـ Chrome — هذا ما تفحصه CF فعلاً
          session = cf_requests.Session(impersonate="chrome124")

          try:
              resp = session.get(TARGET, timeout=30)
              print(f"[~] Status: {resp.status_code}")

              cookies = session.cookies
              cf_val = cookies.get("cf_clearance")

              if not cf_val:
                  print("[!] cf_clearance غير موجود بعد الطلب الأول — جرب retry...")
                  # بعض المواقع تحتاج طلبين
                  time.sleep(3)
                  resp2 = session.get(TARGET, timeout=30)
                  cf_val = session.cookies.get("cf_clearance")

              if not cf_val:
                  print("[!] cf_clearance ما زال غير موجود — الموقع لا يحتاج CF أو blocked. ننجح بلا تحديث.")
                  sys.exit(0)

              # اجمع كل كوكيز CF
              cf_names = ["cf_clearance", "__cf_bm", "__cflb"]
              cookie_str = "; ".join(
                  f"{k}={v}" for k, v in session.cookies.items() if k in cf_names
              )

              # احسب TTL
              # curl_cffi لا يكشف expires مباشرة — نفترض 24h
              ttl_est = 24.0
              print(f"[✓] cf_clearance: {cf_val[:40]}...")
              print(f"[✓] cookie string: {cookie_str[:80]}...")
              print(f"[✓] TTL المقدّر: {ttl_est}h (CF default)")

              # أرسل للـ VPS
              VPS_URL = os.environ.get("VPS_API_URL", "https://animenovaa.duckdns.org")
              APP_SECRET = os.environ.get("APP_SECRET")

              if not APP_SECRET:
                  print("[!] APP_SECRET غير موجود في secrets")
                  sys.exit(1)

              send = cf_requests.post(
                  f"{VPS_URL}/api/admin/update-cf-cookie",
                  headers={"Content-Type": "application/json", "x-app-secret": APP_SECRET},
                  content=json.dumps({"site": SITE, "cookie": cookie_str, "ts": int(time.time() * 1000)}).encode(),
                  timeout=15,
              )

              result = send.json()
              if send.status_code == 200 and result.get("ok"):
                  print(f"[✓] VPS تم التحديث: {result}")
                  summary = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null")
                  with open(summary, "a") as f:
                      f.write(f"## ✅ تم تجديد كوكيز {SITE}\n")
                      f.write(f"- cf_clearance: `{cf_val[:40]}...`\n")
                      f.write(f"- تحديث في: {time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())}\n")
              else:
                  print(f"[!] VPS رفض: {send.status_code} {result}")
                  sys.exit(1)

          except Exception as e:
              print(f"[!] خطأ: {e}")
              sys.exit(1)
          PYEOF
