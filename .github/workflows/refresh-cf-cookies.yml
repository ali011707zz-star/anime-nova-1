name: 🍪 تجديد كوكيز Cloudflare

on:
  schedule:
    # كل 18 ساعة (cf_clearance يدوم 24h → هامش أمان 6h)
    - cron: "0 */18 * * *"
  workflow_dispatch:
    inputs:
      site:
        description: 'الموقع المراد تجديد كوكيزه'
        required: false
        default: 'anime3rb'

jobs:
  refresh:
    name: تجديد cf_clearance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🔧 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 تثبيت puppeteer-extra + stealth
        run: |
          npm init -y
          npm install puppeteer-extra puppeteer-extra-plugin-stealth puppeteer

      - name: 🌐 جلب cf_clearance من anime3rb
        id: get_cookie
        env:
          SITE: ${{ github.event.inputs.site || 'anime3rb' }}
          VPS_API_URL: ${{ secrets.VPS_API_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          node << 'SCRIPT'
          const puppeteer = require('puppeteer-extra');
          const StealthPlugin = require('puppeteer-extra-plugin-stealth');
          puppeteer.use(StealthPlugin());

          const SITE = process.env.SITE || 'anime3rb';
          const URLS = { anime3rb: 'https://anime3rb.com' };
          const TARGET = URLS[SITE];

          if (!TARGET) {
            console.error(`موقع غير معروف: ${SITE}`);
            process.exit(1);
          }

          (async () => {
            console.log(`[*] فتح ${TARGET} (stealth mode) ...`);
            const browser = await puppeteer.launch({
              headless: true,
              args: [
                '--no-sandbox',
                '--disable-setuid-sandbox',
                '--disable-blink-features=AutomationControlled',
              ],
            });
            const page = await browser.newPage();
            await page.setUserAgent('Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36');
            await page.setViewport({ width: 1280, height: 800 });

            const sleep = ms => new Promise(r => setTimeout(r, ms));

            try {
              await page.goto(TARGET, { waitUntil: 'domcontentloaded', timeout: 30000 });

              // انتظر حتى 20 ثانية ريثما يحل CF التحدي
              let cf = null;
              for (let i = 0; i < 4; i++) {
                await sleep(5000);
                const cookies = await page.cookies();
                cf = cookies.find(c => c.name === 'cf_clearance');
                if (cf) break;
                console.log(`[~] انتظار CF... (${(i + 1) * 5}s)`);
              }

              const cookies = await page.cookies();

              if (!cf) {
                console.log('[!] cf_clearance غير موجود — الموقع ربما لا يحتاج CF اليوم، الـ workflow ينجح بلا تحديث');
                await browser.close();
                process.exit(0);
              }

              const cookieStr = cookies
                .filter(c => ['cf_clearance', '__cf_bm', '__cflb'].includes(c.name))
                .map(c => `${c.name}=${c.value}`)
                .join('; ');

              const ttlHours = ((cf.expires * 1000) - Date.now()) / 3600000;
              console.log(`[✓] cf_clearance: ${cf.value.slice(0, 40)}...`);
              console.log(`[✓] TTL الفعلي: ${ttlHours.toFixed(1)} ساعة`);
              console.log(`[✓] expires: ${new Date(cf.expires * 1000).toISOString()}`);

              // أرسل الكوكيز للـ VPS
              const VPS_URL = process.env.VPS_API_URL || 'https://animenovaa.duckdns.org';
              const APP_SECRET = process.env.APP_SECRET;

              if (!APP_SECRET) {
                console.error('[!] APP_SECRET غير موجود في secrets');
                process.exit(1);
              }

              const resp = await fetch(`${VPS_URL}/api/admin/update-cf-cookie`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-app-secret': APP_SECRET,
                },
                body: JSON.stringify({ site: SITE, cookie: cookieStr, ts: Date.now() }),
              });

              const result = await resp.json();
              if (resp.ok && result.ok) {
                console.log(`[✓] VPS تم التحديث: ${JSON.stringify(result)}`);
                require('fs').appendFileSync(
                  process.env.GITHUB_STEP_SUMMARY || '/dev/null',
                  `## ✅ تم تجديد كوكيز ${SITE}\n` +
                  `- TTL الفعلي لـ cf_clearance: **${ttlHours.toFixed(1)} ساعة**\n` +
                  `- تحديث في: ${new Date().toISOString()}\n`
                );
              } else {
                console.error(`[!] VPS رفض: ${resp.status} ${JSON.stringify(result)}`);
                process.exit(1);
              }

              await browser.close();
            } catch (e) {
              console.error('[!] خطأ:', e.message);
              await browser.close();
              process.exit(1);
            }
          })();
          SCRIPT
