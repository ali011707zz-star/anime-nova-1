      .body{fill:#d4cfe0;font-size:12px}
      .muted{fill:#8f879e;font-size:11px}
      .tiny{fill:#8f879e;font-size:9px}
      .card{fill:#171329;stroke:#2d2547;stroke-width:1}
      .line{stroke:#32294b;stroke-width:1}
