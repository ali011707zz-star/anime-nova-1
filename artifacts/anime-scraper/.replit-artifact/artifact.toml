kind = "web"
previewPath = "/"
title = "Nova Anime"
version = "1.0.0"
id = "artifacts/anime-scraper"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24968

[services.development]
run = "pnpm --filter @workspace/anime-scraper run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/anime-scraper", "run", "build" ]
publicDir = "artifacts/anime-scraper/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24968"
BASE_PATH = "/"
