<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Anime — معاينة GIFs للمشغّل</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050508; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; padding: 20px; }

  h1 { text-align: center; font-size: 20px; color: #a78bfa; margin-bottom: 4px; }
  .sub { text-align: center; color: #6b7280; font-size: 12px; margin-bottom: 24px; }

  /* ─── Player Mockup ─── */
  .player-wrap {
    max-width: 800px; margin: 0 auto 32px;
    background: #0d0d14; border-radius: 16px;
    border: 1px solid #1f1f35; overflow: hidden;
    position: relative;
  }
  .player-bg-img {
    width: 100%; aspect-ratio: 16/9; object-fit: cover;
    opacity: 0.18; display: block;
  }
  .player-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
  }
  .gif-circle {
    width: 140px; height: 140px;
    border-radius: 50%; overflow: hidden;
    border: 3px solid #7c3aed;
    box-shadow: 0 0 50px rgba(124,58,237,0.5), 0 0 20px rgba(124,58,237,0.3);
    background: #1a1a2e;
    transition: border-color .3s;
  }
  .gif-circle img { width: 100%; height: 100%; object-fit: cover; }
  .loading-dots {
    display: flex; gap: 6px; align-items: center;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #7c3aed;
    animation: bounce 1.4s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .2s; }
  .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0);opacity:.3} 40%{transform:scale(1);opacity:1} }

  .state-label {
    font-size: 13px; color: #a78bfa; letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 600;
  }
  .ep-meta { font-size: 11px; color: #4b5563; }
  .progress-bar {
    width: 200px; height: 3px; background: #1f1f35; border-radius: 4px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, #7c3aed, #a78bfa);
    width: 0%; animation: load 3s ease-in-out infinite;
  }
  @keyframes load { 0%{width:0%} 70%{width:85%} 100%{width:95%} }

  /* ─── Category Grid ─── */
  .section-title {
    max-width: 800px; margin: 0 auto 14px;
    font-size: 14px; color: #6b7280;
    border-bottom: 1px solid #1a1a2a; padding-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title span { color: #a78bfa; font-weight: 700; }

  .grid {
    max-width: 800px; margin: 0 auto 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
  }
  .card {
    background: #0d0d18;
    border-radius: 10px; overflow: hidden;
    border: 2px solid transparent;
    cursor: pointer;
    transition: border-color .2s, transform .15s, box-shadow .2s;
  }
  .card:hover { border-color: #7c3aed; transform: translateY(-3px); box-shadow: 0 8px 24px rgba(124,58,237,.3); }
  .card.active { border-color: #a78bfa; box-shadow: 0 0 20px rgba(167,139,250,.4); }
  .card img {
    width: 100%; aspect-ratio: 1; object-fit: cover;
    display: block; background: #111;
  }
  .card .lbl {
    padding: 5px 8px; font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card .lbl .name { color: #d1d5db; }
  .card .lbl .cnt { color: #7c3aed; font-weight: 700; font-size: 10px; }

  /* state chips */
  .chips { max-width: 800px; margin: 0 auto 20px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 5px 14px; border-radius: 999px; font-size: 11px; cursor: pointer;
    border: 1px solid #1f2937; background: #0d0d18; color: #9ca3af;
    transition: .2s;
  }
  .chip.active, .chip:hover { background: #7c3aed; color: #fff; border-color: #7c3aed; }
</style>
</head>
<body>

<h1>🎌 GIFs في شاشة "جاري تشغيل الحلقة"</h1>
<p class="sub">اضغط على أي GIF لمعاينته في المشغّل • أو اختر الحالة</p>

<!-- State chips -->
<div class="chips" id="chips">
  <div class="chip active" onclick="setGif('dance','رقص / تحميل',33)">💃 تحميل</div>
  <div class="chip" onclick="setGif('happy','نجاح',15)">✅ نجاح</div>
  <div class="chip" onclick="setGif('celebrate','احتفال',7)">🎉 أول حلقة</div>
  <div class="chip" onclick="setGif('cry','خطأ / فشل',46)">❌ خطأ</div>
  <div class="chip" onclick="setGif('confused','بطء',8)">⏳ بطء</div>
  <div class="chip" onclick="setGif('sleep','انتظار طويل',0)">💤 انتظار</div>
</div>

<!-- Player mockup -->
<div class="player-wrap">
  <img class="player-bg-img" id="bg" src="https://s4.anilist.co/file/anilistcdn/media/anime/banner/16498-8jpFCOcDmneX.jpg" alt="">
  <div class="player-center">
    <div class="gif-circle">
      <img id="main-gif" src="https://raw.githubusercontent.com/bre4d777/anime-gifs/master/dance/1.gif" alt="">
    </div>
    <div class="state-label" id="state-txt">جاري تحميل الحلقة</div>
    <div class="loading-dots">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="progress-bar"><div class="progress-fill"></div></div>
    <div class="ep-meta">الحلقة 1 — هجوم العمالقة | 2013</div>
  </div>
</div>

<!-- All categories -->
<div class="section-title">📂 كل التصنيفات — <span>39 تصنيف • 663 GIF</span></div>
<div class="grid" id="grid"></div>

<script>
const BASE = 'https://raw.githubusercontent.com/bre4d777/anime-gifs/master';

const CATS = [
  { n:'dance',    ar:'رقص',       c:33 },
  { n:'happy',    ar:'سعادة',     c:15 },
  { n:'celebrate',ar:'احتفال',    c:7  },
  { n:'hug',      ar:'عناق',      c:40 },
  { n:'blush',    ar:'خجل',       c:41 },
  { n:'kiss',     ar:'قبلة',      c:36 },
  { n:'pat',      ar:'تربيت',     c:27 },
  { n:'cry',      ar:'بكاء',      c:46 },
  { n:'nom',      ar:'أكل',       c:46 },
  { n:'wave',     ar:'تلويح',     c:22 },
  { n:'smile',    ar:'ابتسامة',   c:20 },
  { n:'shy',      ar:'حياء',      c:17 },
  { n:'laugh',    ar:'ضحك',       c:17 },
  { n:'poke',     ar:'نكزة',      c:17 },
  { n:'mad',      ar:'غضب',       c:25 },
  { n:'nervous',  ar:'توتر',      c:18 },
  { n:'pout',     ar:'تذمر',      c:29 },
  { n:'cuddle',   ar:'دلال',      c:29 },
  { n:'punch',    ar:'لكمة',      c:15 },
  { n:'confused', ar:'تشويش',     c:8  },
  { n:'angrystare',ar:'حدة',      c:32 },
  { n:'bite',     ar:'عض',        c:20 },
  { n:'lick',     ar:'لعق',       c:14 },
  { n:'drool',    ar:'شهية',      c:12 },
  { n:'pinch',    ar:'قرصة',      c:11 },
  { n:'evillaugh',ar:'ضحك شرير', c:10 },
  { n:'handhold', ar:'إمساك يد',  c:10 },
  { n:'nuzzle',   ar:'تدلل',      c:10 },
  { n:'brofist',  ar:'كبشة',      c:9  },
  { n:'love',     ar:'حب',        c:9  },
  { n:'clap',     ar:'تصفيق',     c:8  },
  { n:'headbang', ar:'هز رأس',    c:8  },
  { n:'no',       ar:'رفض',       c:8  },
  { n:'nyah',     ar:'تحدي',      c:8  },
  { n:'bleh',     ar:'اشمئزاز',   c:7  },
  { n:'airkiss',  ar:'بوسة هواء', c:6  },
  { n:'cheers',   ar:'نخب',       c:6  },
  { n:'huh',      ar:'استغراب',   c:6  },
  { n:'peek',     ar:'تلصص',      c:6  },
  { n:'facepalm', ar:'دهشة',      c:5  },
  { n:'nosebleed',ar:'نزيف',      c:5  },
  { n:'cool',     ar:'ببرود',      c:4  },
];

const rand = (max) => Math.floor(Math.random() * Math.min(max||4, 5)) + 1;

function setGif(cat, label, count) {
  const n = rand(count);
  const url = `${BASE}/${cat}/${n}.gif`;
  document.getElementById('main-gif').src = url;
  document.getElementById('state-txt').textContent = label;
  // update chips
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  event?.target?.classList.add('active');
}

const grid = document.getElementById('grid');
CATS.forEach((cat, i) => {
  const n = rand(cat.c);
  const url = `${BASE}/${cat.n}/${n}.gif`;
  const card = document.createElement('div');
  card.className = 'card' + (i === 0 ? ' active' : '');
  card.innerHTML = `
    <img src="${url}" loading="lazy" alt="${cat.ar}">
    <div class="lbl"><span class="name">${cat.ar}</span><span class="cnt">${cat.c}</span></div>
  `;
  card.onclick = () => {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    document.getElementById('main-gif').src = url;
    document.getElementById('state-txt').textContent = cat.ar;
  };
  grid.appendChild(card);
});
</script>
</body>
</html>
